name : test-ci

on :
    push:
        branches:
            - master

jobs:
    test:
        runs-on : ubuntu-latest
        cancel-timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@v2
            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                node-version: 22
            - name: Install dependencies
              run: npm ci
            - name: build test
              run: npm run build
            - name : run tests
              run: npm run test

