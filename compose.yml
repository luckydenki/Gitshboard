name : gitshboard-redis

services:
  #서비스의 이름이며, 이 이름을 docker compose up 뒤에 붙히면 해당 서비스만 실행할 수 있습니다.
  redis:
    image: redis:8-alpine
    container_name: gitshboard-redis-container

    ports:
      - "127.0.0.1:6380:6379"
    # 6380:6379란 호스트의 6380 포트를 컨테이너의 6379 포트에 매핑한다는 의미입니다.
    # 로컬 환경 기준으로 비유하자면 호스트는 내 컴퓨터, 컨테이너는 가상 환경이라고 생각하면 됩니다.

    volumes:
      - redis-data:/data
    
    command:
      - redis-server
     # - --appendonly
     # - "yes"
    # appendonly는 Redis가 데이터를 디스크에 지속적으로 저장하도록 설정하는 옵션입니다. 
    # 이 옵션을 활성화하면 Redis는 모든 쓰기 작업을 로그 파일에 기록하여 데이터 손실을 방지합니다.
    # 필요 없으면 제거해도 됨.

    restart: unless-stopped
    # unless-stopped는 컨테이너가 수동으로 중지되지 않는 한 항상 재시작하도록 설정하는 옵션입니다.

  
  # redis-insight는 Redis의 GUI 관리 도구로, Redis 서버를 시각적으로 모니터링하고 관리할 수 있는 웹 기반 인터페이스를 제공합니다.
  redis-insight:
    image : redis/redisinsight:latest
    container_name : gitshboard-redis-insight
    # 5540포트로 접근 가능한 만큼, localhost:5540으로 접근하면 Redis Insight 웹 인터페이스에 접속할 수 있습니다.
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redis-insight-data:/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
    name: gitshboard-redis-data
  redis-insight-data:
    name: gitshboard-redis-insight-data